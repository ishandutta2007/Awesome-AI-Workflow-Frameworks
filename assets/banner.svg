<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".7"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes floatPill{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(1deg)}}.bg{fill:url(#bgGrad)}.grid-line{stroke:#1e293b;stroke-width:1;stroke-opacity:.35}.flow-wire,.flow-wire-rev{stroke:url(#primaryGrad);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 6;animation:dashMove 14s linear infinite}.flow-wire-rev{stroke:#38bdf8;stroke-width:2;stroke-opacity:.6;stroke-dasharray:6 6;animation:dashMove 9s linear infinite reverse}.pulse-node{transform-origin:center;animation:pulseGlow 4s ease-in-out infinite}.node-orbit1{animation:floatCard1 5s ease-in-out infinite}.node-orbit1,.node-orbit2,.pill-dynamic{transform-box:fill-box;transform-origin:center}.node-orbit2{animation:floatCard2 6s ease-in-out infinite}.pill-dynamic{animation:floatPill 4.5s ease-in-out infinite}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:46px;letter-spacing:-.5px;fill:#fff}.gradient-word{fill:url(#primaryGrad)}.sub-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:19px;fill:#94a3b8}.badge-text,.pill-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600}.pill-text{font-size:12px;fill:#38bdf8}.badge-text{font-size:11px;fill:#cbd5e1}</style><rect width="1200" height="360" class="bg" rx="16"/><g class="grid"><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/><line x1="150" x2="150" y1="0" y2="360" class="grid-line"/><line x1="300" x2="300" y1="0" y2="360" class="grid-line"/><line x1="450" x2="450" y1="0" y2="360" class="grid-line"/><line x1="600" x2="600" y1="0" y2="360" class="grid-line"/><line x1="750" x2="750" y1="0" y2="360" class="grid-line"/><line x1="900" x2="900" y1="0" y2="360" class="grid-line"/><line x1="1050" x2="1050" y1="0" y2="360" class="grid-line"/></g><g opacity=".85"><path fill="none" d="M 80 180 C 200 90, 300 270, 480 180" class="flow-wire"/><path fill="none" d="M 720 180 C 850 80, 950 280, 1120 180" class="flow-wire"/><path fill="none" d="M 820 90 C 960 140, 1020 40, 1140 100" class="flow-wire-rev"/><path fill="none" d="M 60 9