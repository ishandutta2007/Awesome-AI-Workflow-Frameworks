<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    
    /* Flow Animations */
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }

    .flow-wire {
      stroke: url(#primaryGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 8 6;
      animation: dashMove 14s linear infinite;
    }
    .flow-wire-rev {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-opacity: 0.6;
      stroke-linecap: round;
      stroke-dasharray: 6 6;
      animation: dashMove 9s linear infinite reverse;
    }
    .pulse-node {
      transform-origin: center;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .node-orbit1 {
      transform-box: fill-box;
      transform-origin: center;
      animation: floatCard1 5s ease-in-out infinite;
    }
    .node-orbit2 {
      transform-box: fill-box;
      transform-origin: center;
      animation: floatCard2 6s ease-in-out infinite;
    }
    .pill-dynamic {
      transform-box: fill-box;
      transform-origin: center;
      animation: floatPill 4.5s ease-in-out infinite;
    }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .gradient-word {
      fill: url(#primaryGrad);
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Background Tech Grid lines -->
  <g class="grid">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Animated Graph & Flow Curves (Background / Flanks) -->
  <g opacity="0.85">
    <!-- Connecting Workflow Wires -->
    <path d="M 80 180 C 200 90, 300 270, 480 180" fill="none" class="flow-wire" />
    <path d="M 720 180 C 850 80, 950 280, 1120 180" fill="none" class="flow-wire" />
    <path d="M 820 90 C 960 140, 1020 40, 1140 100" fill="none" class="flow-wire-rev" />
    <path d="M 60 90 C 180 50, 260 130, 380 90" fill="none" class="flow-wire-rev" />
    <path d="M 860 270 C 980 220, 1040 320, 1140 270" fill="none" class="flow-wire-rev" />

    <!-- Ambient Glow Orbs -->
    <circle cx="200" cy="100" r="80" fill="url(#accentCyan)" filter="url(#glow)" class="pulse-node" />
    <circle cx="1020" cy="240" r="90" fill="url(#accentPurple)" filter="url(#glow)" class="pulse-node" />
  </g>

  <!-- Animated Orchestration Cards (Flanking Sides - keeps center free for foreground text) -->
  <!-- Left Side Floating Card: Multi-Agent Hub -->
  <g class="node-orbit1">
    <rect x="50" y="220" width="165" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <circle cx="72" cy="245" r="7" fill="#6366f1" />
    <text x="86" y="249" class="badge-text" font-weight="700" fill="#f8fafc">Agent Swarm</text>
    <rect x="70" y="263" width="70" height="6" rx="3" fill="#334155" />
    <rect x="70" y="274" width="115" height="5" rx="2.5" fill="#1e293b" />
    <circle cx="190" cy="245" r="4" fill="#22c55e" />
  </g>

  <!-- Left Side Small Tag -->
  <g class="pill-dynamic">
    <rect x="110" y="55" width="130" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <text x="175" y="74" text-anchor="middle" class="pill-text" fill="#a5b4fc">⚡ RAG Pipeline</text>
  </g>

  <!-- Right Side Floating Card: DAG Workflow -->
  <g class="node-orbit2">
    <rect x="980" y="65" width="170" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <circle cx="1002" cy="90" r="7" fill="#06b6d4" />
    <text x="1018" y="94" class="badge-text" font-weight="700" fill="#f8fafc">DAG Orchestration</text>
    <circle cx="1002" cy="116" r="4" fill="#a855f7" />
    <line x1="1006" y1="116" x2="1035" y2="116" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="1040" cy="116" r="4" fill="#3b82f6" />
    <line x1="1044" y1="116" x2="1073" y2="116" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="1078" cy="116" r="4" fill="#10b981" />
    <text x="1090" y="119" font-size="9" fill="#94a3b8" font-family="sans-serif">Active</text>
  </g>

  <!-- Right Side Tag -->
  <g class="pill-dynamic">
    <rect x="960" y="275" width="160" height="30" rx="15" fill="#164e63" stroke="#06b6d4" stroke-width="1" opacity="0.9" />
    <text x="1040" y="294" text-anchor="middle" class="pill-text" fill="#67e8f9">🤖 Multi-Agent Systems</text>
  </g>

  <!-- FOREGROUND: Solid, perfectly readable Title, Badges & Subtitle -->
  <g id="foreground-content">
    <!-- Top Pill Category Header -->
    <rect x="475" y="48" width="250" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="493" cy="62" r="4" fill="#10b981" />
    <text x="506" y="66" class="pill-text" fill="#38bdf8" font-size="11" letter-spacing="0.5">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="135" text-anchor="middle" class="title-text">
      Awesome <tspan class="gradient-word">AI Workflow Frameworks</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="176" text-anchor="middle" class="sub-text">
      Agent Orchestration • Pipeline Composition • Production LLM Applications
    </text>

    <!-- Lower Feature Tags / Highlights -->
    <g transform="translate(310, 220)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="65" y="21" text-anchor="middle" class="badge-text">🛠️ Frameworks</text>

      <rect x="145" y="0" width="140" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="215" y="21" text-anchor="middle" class="badge-text">🚀 SaaS Platforms</text>

      <rect x="300" y="0" width="140" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="370" y="21" text-anchor="middle" class="badge-text">⭐ Open Source</text>

      <rect x="455" y="0" width="130" height="34" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="520" y="21" text-anchor="middle" class="badge-text">📊 Market Insights</text>
    </g>

    <!-- Footer Stats / Meta Line -->
    <text x="600" y="305" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Complete Directory of Production LLM Stack • Autonomous Agents • RAG Architectures
    </text>
  </g>
</svg>
